
# Minecraft servers are created and managed by the web panel (one container
# per server, named mc-<slug>). This file only runs the panel itself.
#
# Optional: you can also run the panel directly on the host with `make panel`.
#
# Paths are mounted at the SAME absolute path inside the panel container,
# because the panel hands them to Docker as bind-mount sources for the
# Minecraft containers it creates.

services:
  panel:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: minecraft-panel
    ports:
      - "${PANEL_PORT:-3001}:3001"
    env_file:
      - webapp/backend/.env
    environment:
      PORT: "3001"
      HOST_REPO_ROOT: "${PWD}"
      SERVERS_ROOT: "${PWD}/servers"
      BACKUPS_ROOT: "${PWD}/backup"
    # Same uid as the host user so server files and backups stay editable,
    # plus the docker group to use the socket.
    user: "${PANEL_UID:-1000}:${PANEL_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/servers:${PWD}/servers
      - ${PWD}/backup:${PWD}/backup
      - ${PWD}/data:${PWD}/data # legacy single-server data (import it from the panel)
      - ${PWD}/webapp/backend/data:/opt/panel/webapp/backend/data # panel database
      - ${PWD}/webapp/backend/config:/opt/panel/webapp/backend/config # Google Drive tokens
    restart: unless-stopped
